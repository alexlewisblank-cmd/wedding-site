<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Alex &amp; Maddi | RSVP</title>
    <link rel="shortcut icon" type="image/png" href="assets/favicon.ico">
    <meta property="og:site_name" content="Alex &amp; Maddi | Wedding" />
    <meta property="og:type" content="website" />
    <meta name="title" property="og:title" content="Alex &amp; Maddi | Wedding" />
    <meta name="description" property="og:description" content="RSVP for Alex &amp; Maddi's Wedding" />
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta name="theme-color" content="#FAF8F5">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,200;0,300;0,400;0,600;0,700;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="all">
    <script src="https://kit.fontawesome.com/3b059272ba.js" crossorigin="anonymous"></script>
</head>

<body class="internal">
    <section class="hero">
        <div>
            <h1>
                Please RSVP with the name/s of those attending below by the 31st of July 2027.
            </h1>
        </div>
        <div class="navigation">
            <a class="logo" href="index.html">
                <img src="assets/home_icon.png" alt="Home">
                <div class="test">
                    <img src="assets/home_icon.png" alt="Home">
                    <div><p>Take me back</p></div>
                </div>
            </a>
            <div class="menu">
                <a href="location.html">Get there</a>
                <a href="location.html#accomodations">Sleep</a>
            </div>
            <div class="rsvp">
                <a href="rsvp.html">
                    <img src="assets/RSVP-2.png" alt="RSVP">
                </a>
            </div>
        </div>
    </section>

    <section id="rsvp-section" class="standard">
        <div style="max-width: 600px; margin: 0 auto; width: 100%;">
            <p class="bigtext">RSVP</p>
            <div class="divider bottom"></div>
            <form action="https://api.web3forms.com/submit" method="POST" style="display: flex; flex-direction: column; gap: 20px; text-align: left; margin-top: 30px;">
                <input type="hidden" name="apikey" value="4cef8d90-1b4e-4152-b343-450b7a93c8ee">
                <input type="hidden" name="access_key" value="4cef8d90-1b4e-4152-b343-450b7a93c8ee">

                <div>
                    <label for="name" style="display: block; font-weight: 600; margin-bottom: 8px;">Full Name *</label>
                    <input type="text" id="name" name="name" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem; box-sizing: border-box;">
                </div>

                <div>
                    <label for="attendance" style="display: block; font-weight: 600; margin-bottom: 8px;">Attendance *</label>
                    <select id="attendance" name="attendance" required style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem; box-sizing: border-box; background-color: #fff;">
                        <option value="" disabled selected>Select your response</option>
                        <option value="Accepts with pleasure">Accepts with pleasure</option>
                        <option value="Decline with regret">Decline with regret</option>
                    </select>
                </div>

                <div>
                    <label for="dietary" style="display: block; font-weight: 600; margin-bottom: 8px;">Dietary Requirements</label>
                    <textarea id="dietary" name="dietary" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1rem; box-sizing: border-box; resize: vertical;"></textarea>
                </div>

                <div style="text-align: center; margin-top: 10px;">
                    <button type="submit" style="background-color: #333; color: #fff; padding: 14px 28px; border: none; border-radius: 4px; font-size: 1rem; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">Submit RSVP</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
